name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - run: pip install -r requirements-live.txt pytest
      - run: python -m pytest -q tests
        env:
          PYTHONIOENCODING: utf-8
